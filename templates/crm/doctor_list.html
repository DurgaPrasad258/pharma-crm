{% extends 'crm/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>Doctors</h2>
  <a href="{% url 'add_doctor' %}" class="btn btn-primary">
    <i class="bi bi-person-plus"></i> Add Doctor
  </a>
</div>

<div class="list-group">
  {% for doctor in doctors %}
    <a href="{% url 'doctor_detail' doctor.id %}" class="list-group-item list-group-item-action">
      <i class="bi bi-person-fill"></i> {{ doctor.name }}
    </a>
  {% empty %}
    <div class="alert alert-info">No doctors found.</div>
  {% endfor %}
</div>
{% endblock %}
