<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pharma CRM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .wrapper {
      display: flex;
      flex: 1;
    }
    .sidebar {
      width: 250px;
      background-color: #f8f9fa;
      padding-top: 1rem;
      height: 100vh;
    }
    .content {
      flex: 1;
      padding: 2rem;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">Pharma CRM</span>
    <span class="text-light">
      {% if user.is_authenticated %}
        Hi, {{ user.username }} |
        <a class="nav-link" href="{% url 'logout' %}">Logout</a>
      {% endif %}
    </span>
  </div>
</nav>

<!-- Wrapper with Sidebar + Main Content -->
<div class="wrapper">
  <!-- Sidebar -->
  <div class="sidebar border-end">
    <ul class="nav flex-column px-3">
      <li class="nav-item">
        <a class="nav-link" href="{% url 'dashboard' %}"><i class="bi bi-speedometer2"></i> Dashboard</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{% url 'home' %}"><i class="bi bi-person-lines-fill"></i> Doctors</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{% url 'add_visit' %}"><i class="bi bi-calendar-plus"></i> Add Visit</a>
      </li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="content">
    {% block content %}
    {% endblock %}
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
